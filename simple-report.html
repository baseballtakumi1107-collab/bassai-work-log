function initMulti(){
 state.histories=state.histories||{};
 if(!Array.isArray(state.vehicleList))state.vehicleList=state.vehicle?state.vehicle.split(/\s*[、,，\n]\s*/).filter(Boolean):[''];if(!state.vehicleList.length)state.vehicleList=[''];
 if(!Array.isArray(state.crewList))state.crewList=state.crew?state.crew.split(/\s*[、,，\n]\s*/).filter(Boolean):[''];if(!state.crewList.length)state.crewList=[''];
 drawMulti('vehicle');drawMulti('crew');
}
function updateMulti(){
 state.vehicle=state.vehicleList.filter(Boolean).join('、');
 state.crew=state.crewList.filter(Boolean).join('、');
 $('vehicle').value=state.vehicle;$('crew').value=state.crew;
 state.vehicleList.forEach(v=>addHistory('vehicles',v.trim()));
 state.crewList.forEach(v=>addHistory('crews',v.trim()));
 saveState();
}
function drawMulti(type){
 const isV=type==='vehicle',key=isV?'vehicleList':'crewList',history=isV?'vehicles':'crews',box=$(isV?'vehicleRows':'crewRows');
 box.innerHTML='';
 state[key].forEach((value,i)=>{
  const row=document.createElement('div');row.className='person-row';
  const number=document.createElement('span');number.className='index';number.textContent=(i+1)+'.';row.appendChild(number);
  const wrap=document.createElement('div');wrap.className='autocomplete-wrap';
  const input=document.createElement('input');input.value=value;input.placeholder=isV?'車両ナンバーを入力':'班員名を入力';input.setAttribute('aria-label',(isV?'車両':'班員')+(i+1));input.autocomplete='off';
  const suggestions=document.createElement('div');suggestions.className='suggestions';
  function showSuggestions(){
   const query=input.value.trim().toLowerCase();
   const list=[...new Set([...(state.histories[history]||[]),...state[key]].filter(Boolean))].filter(v=>!query||v.toLowerCase().includes(query)).slice(0,15);
   suggestions.innerHTML='';
   list.forEach(v=>{const opt=document.createElement('button');opt.type='button';opt.textContent=v;
    opt.addEventListener('pointerdown',e=>e.preventDefault());
    opt.onclick=()=>{state[key][i]=v;updateMulti();drawMulti(type)};
    suggestions.appendChild(opt)});
   suggestions.classList.toggle('show',list.length>0 && document.activeElement===input);
  }
  input.addEventListener('focus',showSuggestions);
  input.addEventListener('input',()=>{state[key][i]=input.value;updateMulti();showSuggestions()});
  input.addEventListener('blur',()=>{setTimeout(()=>suggestions.classList.remove('show'),180);updateMulti()});
  wrap.appendChild(input);wrap.appendChild(suggestions);row.appendChild(wrap);
  const del=document.createElement('button');del.type='button';del.textContent='削除';del.setAttribute('aria-label',(isV?'車両':'班員')+(i+1)+'を削除');del.onclick=()=>{state[key].splice(i,1);if(!state[key].length)state[key].push('');updateMulti();drawMulti(type)};row.appendChild(del);
  box.appendChild(row);
 });
}

// SafariのSVG画像化が失敗する場合は、表示中の日報のDOMを直接描画する。
async function createReportPDFFallback(){
 const root=$('report'), width=1122, height=794;
 const canvas=document.createElement('canvas');canvas.width=2244;canvas.height=1588;
 const ctx=canvas.getContext('2d');ctx.scale(2,2);ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);
 const extra=document.createElement('style');extra.textContent='#report .report-main .data-row,#report .report-main .blank-row{height:31px!important}#report .report-main thead tr{height:24px!important}#report .report-footer th,#report .report-footer td{height:31px!important}#report .report-crew tbody tr{height:24px!important}';document.head.appendChild(extra);
 const oldStyle=root.getAttribute('style');
 root.style.setProperty('width',width+'px','important');
 root.style.setProperty('min-height','0','important');
 root.style.setProperty('height','auto','important');
 root.style.setProperty('padding','18px','important');
 root.style.setProperty('box-sizing','border-box','important');
 const base=root.getBoundingClientRect();
 const offsetX=18,offsetY=18;
 const pos=r=>({x:r.left-base.left+offsetX,y:r.top-base.top+offsetY,w:r.width,h:r.height});
 try{
  const walk=el=>{
   if(el.nodeType===3){
    const value=el.textContent;
    if(!value.trim())return;
    const parent=el.parentElement,st=getComputedStyle(parent);
    if(st.display==='none'||st.visibility==='hidden')return;
    const range=document.createRange();range.selectNodeContents(el);
    const rects=[...range.getClientRects()];
    ctx.fillStyle=st.color||'#111';
    ctx.font=st.font||'10px serif';
    ctx.textBaseline='top';
    rects.forEach((r,i)=>{
      const v=rects.length===1?value.trim():value.trim().split(/\s+/)[i]||value.trim();
      const q=pos(r);ctx.fillText(v,q.x,q.y,Math.max(q.w+3,5));
    });
    return;
   }
   if(el.nodeType!==1)return;
   const st=getComputedStyle(el);
   if(st.display==='none'||st.visibility==='hidden')return;
   const r=pos(el.getBoundingClientRect());
   if(['TD','TH'].includes(el.tagName)){
    ctx.strokeStyle='#222';ctx.lineWidth=.65;ctx.strokeRect(r.x,r.y,r.w,r.h);
   }
   if(el.classList.contains('reportmeta')){
    ctx.strokeStyle='#222';ctx.beginPath();ctx.moveTo(r.x,r.y+r.h);ctx.lineTo(r.x+r.w,r.y+r.h);ctx.stroke();
   }
   if(el.classList.contains('circled')||el.classList.contains('circled-work')){
    ctx.strokeStyle='#111';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(r.x+r.w/2,r.y+r.h/2,r.w/2+3,r.h/2+2,0,0,Math.PI*2);ctx.stroke();
   }
   [...el.childNodes].forEach(walk);
  };
  walk(root);
  const jpg=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('画像を保存できません')),'image/jpeg',.95));
  const fitted=document.createElement('canvas');fitted.width=2244;fitted.height=1588;
  const fc=fitted.getContext('2d');fc.fillStyle='white';fc.fillRect(0,0,fitted.width,fitted.height);
  const contentHeight=Math.min(794,Math.max(420,root.scrollHeight+36));
  const drawW=2196,drawH=Math.min(1500,drawW*contentHeight/1122);
  fc.drawImage(canvas,0,0,2244,Math.round(contentHeight*2),24,(1588-drawH)/2,drawW,drawH);
  const finalJpg=await new Promise((resolve,reject)=>fitted.toBlob(b=>b?resolve(b):reject(Error('PDF画像変換失敗')),'image/jpeg',.95));
  return buildPDFWithJPEG(new Uint8Array(await finalJpg.arrayBuffer()),fitted.width,fitted.height);
 }finally{
  extra.remove();if(oldStyle===null)root.removeAttribute('style');else root.setAttribute('style',oldStyle);
 }
}

async function createReportPDF(){
  // 日報確認画面と同じ幅・高さ・文字サイズで画像化する。
  const width=1122,height=794;
  const report=$('report');
  const clone=report.cloneNode(true);
  // IDを残さないと #report に対する表のスタイルがPDFから消えてしまう。
  clone.setAttribute('style','display:block!important;position:static!important;width:1122px!important;height:794px!important;min-height:0!important;max-height:none!important;margin:0!important;padding:24px!important;background:#fff!important;color:#111!important;box-shadow:none!important;overflow:hidden!important;box-sizing:border-box!important');
  const css=[...document.styleSheets].map(sheet=>{try{return [...sheet.cssRules].map(r=>r.cssText).join('\n')}catch(e){return ''}}).join('\n');
  const override=`#report{display:block!important;width:1122px!important;height:794px!important;padding:24px!important;box-sizing:border-box!important;overflow:hidden!important;background:white!important;color:#111!important}
  #report .reporttable{font-size:12px!important;line-height:1.2!important}
  #report .report-main .data-row,#report .report-main .blank-row{height:29px!important}
  #report .report-main thead tr{height:28px!important}
  #report .reporttable td,#report .reporttable th{padding:1px!important}
  #report .report-footer th,#report .report-footer td{height:29px!important}
  #report .report-work td{height:49px!important}
  #report .report-crew tbody tr{height:24px!important}
  #report .report-bottom{margin-top:5px!important}
  #report .reportmeta{font-size:13px!important} #report .reportmeta b:first-child{font-size:18px!important} #report .reportmeta .report-date strong{font-size:18px!important;font-weight:700!important;letter-spacing:0!important} #report .reportmeta .report-weather{font-size:12px!important} #report .heavy-label,#report .report-main .reportnote .total-inline,#report .report-main .reportnote .total-inline b{font-size:11px!important} #report .nowrap-head{font-size:10px!important}`;
  const content=`<html xmlns="http://www.w3.org/1999/xhtml"><head><meta charset="utf-8"/><style>${css.replace(/<\/style/gi,'')}\n${override}</style></head><body style="margin:0;background:white">${clone.outerHTML}</body></html>`;
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+width+'" height="'+height+'"><foreignObject width="100%" height="100%">'+content+'</foreignObject></svg>';
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
  try{
    const img=new Image();
    const loaded=new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('日報の画像化に失敗しました'));setTimeout(()=>reject(new Error('画像化がタイムアウトしました')),8000)});
    img.src=url;await loaded;
    const cv=document.createElement('canvas');cv.width=2244;cv.height=1588;
    const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);const contentHeight=height;
    const drawW=2152,drawH=Math.min(1512,drawW*contentHeight/width);
    ctx.drawImage(img,0,0,width,contentHeight,24,(cv.height-drawH)/2,drawW,drawH);
    const blob=await new Promise(resolve=>cv.toBlob(resolve,'image/jpeg',.96));
    if(!blob||blob.size<3000)throw new Error('PDF画像を作成できませんでした');
    return buildPDFWithJPEG(new Uint8Array(await blob.arrayBuffer()),cv.width,cv.height);
  }finally{URL.revokeObjectURL(url)}
}

function buildPDFWithJPEG(jpg,W,H){
 const encoder=new TextEncoder(),chunks=[],offsets=[0];let length=0;
 const add=b=>{chunks.push(b);length+=b.length};const str=t=>add(encoder.encode(t));
 str('%PDF-1.4\n');
 function obj(n,body){offsets[n]=length;str(n+' 0 obj\n'+body+'\nendobj\n')}
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
 obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
 obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 841.89 595.28] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
 offsets[4]=length;str('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+W+' /Height '+H+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');add(jpg);str('\nendstream\nendobj\n');
 const cmd='q 841.89 0 0 595.28 0 0 cm /Im0 Do Q\n';
 obj(5,'<< /Length '+encoder.encode(cmd).length+' >>\nstream\n'+cmd+'endstream');
 const xref=length;str('xref\n0 6\n0000000000 65535 f \n');
 for(let i=1;i<=5;i++)str(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
 str('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
 const bytes=new Uint8Array(length);let at=0;for(const part of chunks){bytes.set(part,at);at+=part.length}
 return new Blob([bytes],{type:'application/pdf'});
}
