<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>簡単日報・集計表入力</title><style>body{font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;margin:0;background:#f3f6f4;color:#21382d}header{background:#176b52;color:white;padding:16px;font-weight:bold}main{max-width:950px;margin:auto;padding:12px}.card{background:white;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #d5e1db}input,select,button{font:inherit;padding:10px;border:1px solid #b6c9bf;border-radius:7px}input{max-width:100%;box-sizing:border-box}button{background:white;color:#176b52;font-weight:bold;cursor:pointer}.primary{background:#176b52;color:white}.row{display:flex;gap:8px;flex-wrap:wrap}.row label{flex:1;min-width:130px}.row input{width:100%}label{display:block;font-size:13px;font-weight:bold;margin-bottom:9px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid #bacbc2;text-align:center;padding:6px}#matrix{min-width:760px}#matrix th{font-size:12px;background:#e8f1eb}#matrix td{padding:2px}#matrix td button{width:100%;min-height:43px;padding:5px}#matrix td button.filled{background:#d7efe0}.muted{color:#64756c;font-size:12px}.stat{background:#e8f1eb;padding:12px;border-radius:8px;margin-top:10px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}.modal.show{display:flex}.dialog{background:white;padding:20px;border-radius:14px;width:min(350px,100%);box-sizing:border-box}.dialog input{width:100%;font-size:26px;text-align:center;margin:12px 0}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.pad button{font-size:22px;min-height:54px}.hidden{display:none}#report{display:none}#report table{font-size:10px}#report td,#report th{border:1px solid black}#report h2{margin:0 0 8px}@media print{@page{size:A4 landscape;margin:6mm}body>*:not(#report){display:none!important}#report{display:block!important;font-family:serif;color:black}#report table{table-layout:fixed}#report td{height:22px}}/* iPhone等の狭い画面でも基本情報の入力欄を重ねない */
.row > label{min-width:0;flex:1 1 220px;box-sizing:border-box;overflow-wrap:anywhere}
.row > label input,.row > label select{display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;margin-top:5px}
@media(max-width:600px){.row > label{flex:1 1 100%;width:100%}.row > label input[type=date]{min-height:44px}}
.multi-block{margin-top:16px;padding-top:10px;border-top:1px solid #e1e9e4}.multi-block h4{margin:0 0 10px}.person-row{display:flex;align-items:center;gap:7px;margin:7px 0;flex-wrap:wrap}.person-row input{flex:2 1 150px;min-width:0;width:100%}.person-row select{flex:1 1 135px;min-width:0;width:100%}.person-row button{flex:0 0 auto}.multi-block>button{margin-top:8px;background:#e5f3eb}.person-row .index{min-width:24px;font-weight:bold;color:#64756c}@media(max-width:520px){.person-row input{flex-basis:calc(100% - 92px)}.person-row select{margin-left:30px;flex:1 1 130px}.person-row button{margin-left:auto}}
</style></head><body><header>簡単日報｜集計表入力</header><main><section class="card"><h3>① 基本情報</h3><label style="max-width:320px">作業日<input type="date" id="date" style="width:100%"></label>
<div class="multi-block"><h4>車両ナンバー <span class="muted">（4〜6台でも登録可能）</span></h4><div id="vehicleRows"></div><button type="button" id="addVehicle">＋ 車両を追加</button></div>
<div class="multi-block"><h4>班員 <span class="muted">（6人以上も登録可能）</span></h4><div id="crewRows"></div><button type="button" id="addCrew">＋ 班員を追加</button></div>
<div style="display:none"><input id="vehicle"><select id="vehicleHistory"></select><input id="crew"><select id="crewHistory"></select></div></section><section class="card"><h3>② 電柱間の入力</h3><div class="row"><label>付託番号（5桁）<input id="futaku" inputmode="numeric" maxlength="5" placeholder="12345"><select id="futakuHistory"><option value="">5桁番号の履歴</option></select></label><label>枝番<input id="branch" inputmode="numeric" maxlength="1" placeholder="1"></label><label>電柱番号<input id="pole" placeholder="例：123ハ123〜124"><select id="poleHistory"><option value="">電柱番号の履歴から選ぶ</option></select></label></div><p class="muted">表の＋を押すと数字入力画面が開きます。数字をもう一度押せば修正できます。</p><div class="scroll"><table id="matrix"></table></div><div class="stat" id="sum"></div><div class="row" style="margin-top:12px"><button class="primary" id="save">この地権者分を保存</button><button id="another">同じ付託・電柱間で地権者を追加</button><button id="clear">表をクリア</button></div></section><section class="card"><h3>③ 保存した作業（地権者ごとに1行）</h3><div id="saved"></div><div class="row"><button class="primary" id="print">当日の日報を印刷（A4横）</button><button id="export">バックアップ保存</button><label style="flex:0 0 auto">バックアップ読込<input type="file" id="import" accept="application/json"></label></div></section><section class="card"><h3>工量設定</h3><p class="muted">以前の試作版に設定されていた工量を引き継ぎ。大枝・小枝の「幹元／幹元以外」など、旧基準だけでは区別できないものは未設定にしています。確認後に係数を入力してください。</p><div id="rates"></div></section></main><div class="modal" id="modal"><div class="dialog"><b id="selected"></b><input id="number" type="text" inputmode="none" placeholder="本数"><div class="pad" id="pad"></div><div class="row" style="margin-top:10px"><button id="cancel">戻る</button><button id="erase">削除</button><button class="primary" id="confirm">確定</button></div></div></div><section id="report"></section><script>
const trees=['杉','桧','雑','孟宗','カラ','小雑','女竹'],cuts=['根切り','芯止め','大枝幹元','大枝幹元以外','小枝幹元','小枝幹元以外'];const KEY='bassai_simple_grid_v2';const initial={'杉|根切り':105,'杉|芯止め':68,'桧|根切り':105,'桧|芯止め':68,'雑|根切り':40,'雑|芯止め':40,'孟宗|根切り':7,'孟宗|芯止め':7,'女竹|根切り':77,'女竹|芯止め':77};let state={branch:"1",prefix:"",histories:{futaku:[],poles:[],vehicles:[],crews:[]},vehicle:'',crew:'',futaku:'',start:'',end:'',date:new Date().toLocaleDateString('en-CA'),cells:{},spans:[],rates:initial};try{let saved=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('bassai_simple_grid_v1')||'{}');state={...state,...saved};state.histories=state.histories||{futaku:[],poles:[],vehicles:[],crews:[]};if(state.futaku.includes('-')){let a=state.futaku.split('-');state.futaku=a[0];state.branch=a[1]||'1'}}catch{}if(!state.pole)state.pole=(state.prefix||'')+(state.start||'')+(state.end?'〜'+state.end:'');state.spans=state.spans.map(s=>({...s,pole:s.pole||((s.prefix||'')+(s.start||'')+(s.end?'〜'+s.end:''))}));let editIndex=null,active=null;const $=id=>document.getElementById(id),saveState=()=>localStorage.setItem(KEY,JSON.stringify(state));function sync(){['vehicle','crew','futaku','branch','pole','date'].forEach(k=>$(k).value=state[k]||'');}sync();['vehicle','crew','futaku','branch','pole','date'].forEach(k=>$(k).addEventListener('input',e=>{state[k]=e.target.value;saveState()}));function addHistory(type,value){if(!value)return;state.histories=state.histories||{futaku:[],poles:[],vehicles:[],crews:[]};let a=state.histories[type]||[];state.histories[type]=[value,...a.filter(v=>v!==value)].slice(0,40)}
function renderHistory(){const config=[['futakuHistory','futaku'],['poleHistory','poles'],['vehicleHistory','vehicles'],['crewHistory','crews']];for(const [id,key] of config){let select=$(id);select.innerHTML='<option value="">'+({futaku:'5桁番号の履歴',poles:'電柱間の履歴',vehicles:'車両履歴から選ぶ',crews:'班員履歴から選ぶ'}[key])+'</option>'+(state.histories?.[key]||[]).map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}}
function poleString(){return state.pole.trim()}
function persistBasics(){addHistory('vehicles',state.vehicle.trim());addHistory('crews',state.crew.trim());saveState();renderHistory()}
['vehicle','crew'].forEach(id=>$(id).addEventListener('change',persistBasics));
$('futakuHistory').onchange=e=>{if(e.target.value){state.futaku=e.target.value;sync();saveState()}};
$('poleHistory').onchange=e=>{if(e.target.value){state.pole=e.target.value;sync();saveState()}};
$('vehicleHistory').onchange=e=>{if(e.target.value){state.vehicle=e.target.value;sync();saveState()}};
$('crewHistory').onchange=e=>{if(e.target.value){state.crew=e.target.value;sync();saveState()}};
renderHistory();
function calc(cells){let qty=0,work=0,unknown=[];for(const [k,n] of Object.entries(cells)){if(!n)continue;qty+=n;if(state.rates[k]===undefined||state.rates[k]==='')unknown.push(k);else work+=n*Number(state.rates[k]);}return {qty,work,unknown}}function renderMatrix(){let html='<tr><th>樹種＼切り方</th>'+cuts.map(x=>'<th>'+x+'</th>').join('')+'</tr>';for(const t of trees){html+='<tr><th>'+t+'</th>';for(const c of cuts){let k=t+'|'+c,n=state.cells[k];html+='<td><button class="'+(n?'filled':'')+'" data-key="'+k+'">'+(n??'＋')+'</button></td>'}html+='</tr>'}$('matrix').innerHTML=html;document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>openModal(b.dataset.key));const x=calc(state.cells);$('sum').textContent='合計 '+x.qty+' 本 ／ 確定工量 '+x.work+(x.unknown.length?' ／ 工量未設定 '+x.unknown.join('、'):'')};function openModal(k){active=k;$('selected').textContent=k.replace('|',' ／ ');$('number').value=state.cells[k]??'';$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show');active=null}function applyNumber(remove=false){if(!active)return;let v=$('number').value;if(!remove&&(!/^\d+$/.test(v)||Number(v)>99999)){alert('本数は0以上の整数で入力してください');return}if(remove||Number(v)===0)delete state.cells[active];else state.cells[active]=Number(v);saveState();closeModal();renderMatrix()}$('pad').innerHTML=['1','2','3','4','5','6','7','8','9','C','0','⌫'].map(v=>'<button data-digit="'+v+'">'+v+'</button>').join('');document.querySelectorAll('[data-digit]').forEach(b=>b.onclick=()=>{let d=b.dataset.digit,v=$('number').value;$('number').value=d==='C'?'':d==='⌫'?v.slice(0,-1):v+d});$('confirm').onclick=()=>applyNumber();$('erase').onclick=()=>applyNumber(true);$('cancel').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};function saveOwner(keep=false){if(!/^\d{5}$/.test(state.futaku)||!/^\d$/.test(state.branch)){alert('付託番号は5桁、枝番は1桁で入力してください');return false}if(!state.pole.trim()){alert('電柱番号を入力してください');return false}if(!calc(state.cells).qty){alert('本数を入力してください');return false}let span={futaku:state.futaku+'-'+state.branch,base:state.futaku,branch:state.branch,pole:state.pole,cells:{...state.cells},date:state.date,group:state.futaku+'-'+state.branch+'|'+poleString()};if(editIndex===null)state.spans.push(span);else state.spans[editIndex]=span;editIndex=null;addHistory('futaku',state.futaku);addHistory('poles',poleString());persistBasics();state.cells={};if(!keep){state.pole=''}saveState();sync();renderAll();return true}
$('save').onclick=()=>saveOwner(false);
$('another').onclick=()=>{if(saveOwner(true))alert('保存しました。同じ付託番号・電柱間で次の地権者分を入力してください')};
$('clear').onclick=()=>{if(confirm('表の入力をクリアしますか？')){state.cells={};saveState();renderMatrix()}};function renderSaved(){let html='';state.spans.forEach((s,i)=>{let c=calc(s.cells);html+='<div style="padding:9px;border-bottom:1px solid #ddd"><b>'+esc(s.futaku)+'　'+esc((s.pole||''))+'</b><p>'+c.qty+'本／確定工量 '+c.work+(c.unknown.length?'（未設定あり）':'')+'</p><button data-edit="'+i+'">編集</button> <button data-del="'+i+'">削除</button></div>'});$('saved').innerHTML=html||'<p class="muted">まだ保存されていません</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editIndex=Number(b.dataset.edit);let s=state.spans[editIndex];Object.assign(state,{futaku:s.base||s.futaku.split('-')[0],branch:s.branch||s.futaku.split('-')[1]||'1',pole:s.pole||((s.prefix||'')+(s.start||'')+(s.end?'〜'+s.end:'')),cells:{...s.cells},date:s.date});sync();renderMatrix();window.scrollTo(0,0)});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('この電柱間を削除しますか？')){state.spans.splice(Number(b.dataset.del),1);saveState();renderSaved()}})}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderRates(){let h='<div class="scroll"><table><tr><th>樹種</th>'+cuts.map(c=>'<th>'+c+'</th>').join('')+'</tr>';for(const t of trees){h+='<tr><th>'+t+'</th>';for(const c of cuts){let k=t+'|'+c;h+='<td><input style="width:66px;padding:6px" type="number" min="0" data-rate="'+k+'" value="'+(state.rates[k]??'')+'" placeholder="未設定"></td>'}h+='</tr>'}h+='</table></div>';$('rates').innerHTML=h;document.querySelectorAll('[data-rate]').forEach(e=>e.onchange=()=>{if(e.value==='')delete state.rates[e.dataset.rate];else if(Number(e.value)>=0)state.rates[e.dataset.rate]=Number(e.value);saveState();renderMatrix();renderSaved()})}function renderAll(){renderMatrix();renderSaved();renderRates();renderHistory()}renderAll();$('print').onclick=()=>{if(!state.spans.length){alert('先に電柱間を保存してください');return}let unknown=state.spans.flatMap(s=>calc(s.cells).unknown);if(unknown.length&&!confirm('工量未設定の項目があります。未確定のまま印刷しますか？'))return;let total=0,work=0;let previous='';let rows=state.spans.filter(s=>s.date===state.date).map((s,i)=>{let x=calc(s.cells);let group=s.group||s.futaku+'|'+(s.pole||'')+'〜'+s.end;let same=group===previous;previous=group;total+=x.qty;work+=x.work;return '<tr><td>'+(i+1)+'</td><td>'+esc(s.futaku)+'</td><td>'+esc((s.pole||''))+'</td><td>'+x.qty+'</td><td>'+x.work+(x.unknown.length?' ※':'')+'</td><td></td></tr>'}).join('');$('report').innerHTML='<h2>簡単日報</h2><p>作業日：'+esc(state.date)+'　車両：'+esc(state.vehicle)+'　班員：'+esc(state.crew)+'</p><table><thead><tr><th style="width:7%">No.</th><th>付託番号</th><th>電柱番号</th><th>本数</th><th>工量</th><th>備考（手書き訂正用）</th></tr></thead><tbody>'+rows+'<tr><th colspan="3">合計（'+new Set(state.spans.filter(s=>s.date===state.date).map(s=>s.group||s.futaku+'|'+s.pole)).size+'径間）</th><th>'+total+'</th><th>'+work+'</th><td></td></tr></tbody></table><p style="font-size:10px">※工量未設定の項目は計算に含まれていません。</p>';window.print()};$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='簡単日報バックアップ.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.spans))throw Error();if(confirm('現在のデータをバックアップ内容で置き換えますか？')){state={...state,...x};state.histories=state.histories||{futaku:[],poles:[],vehicles:[],crews:[]};saveState();sync();renderAll()}}catch{alert('バックアップ形式を確認してください')}};

// 複数車両・複数班員（旧データの文字列からも移行）
function initMulti(){
 if(!Array.isArray(state.vehicleList))state.vehicleList=state.vehicle?state.vehicle.split(/\s*[、,，\n]\s*/).filter(Boolean):[''];
 if(!Array.isArray(state.crewList))state.crewList=state.crew?state.crew.split(/\s*[、,，\n]\s*/).filter(Boolean):[''];
 drawMulti('vehicle');drawMulti('crew');
}
function updateMulti(){
 state.vehicle=state.vehicleList.filter(Boolean).join('、');
 state.crew=state.crewList.filter(Boolean).join('、');
 $('vehicle').value=state.vehicle;$('crew').value=state.crew;
 state.vehicleList.forEach(v=>addHistory('vehicles',v.trim()));
 state.crewList.forEach(v=>addHistory('crews',v.trim()));
 saveState();
}
function drawMulti(type){
 let isV=type==='vehicle',key=isV?'vehicleList':'crewList',history=isV?'vehicles':'crews',box=$(isV?'vehicleRows':'crewRows');
 box.innerHTML='';
 state[key].forEach((value,i)=>{
  const row=document.createElement('div');row.className='person-row';
  const number=document.createElement('span');number.className='index';number.textContent=(i+1)+'.';row.appendChild(number);
  const input=document.createElement('input');input.value=value;input.placeholder=isV?'車両ナンバーを入力':'班員名を入力';input.setAttribute('aria-label',(isV?'車両':'班員')+(i+1));
  input.addEventListener('input',()=>{state[key][i]=input.value;updateMulti()});
  input.addEventListener('change',()=>{updateMulti();drawMulti(type)});row.appendChild(input);
  const sel=document.createElement('select');sel.setAttribute('aria-label','履歴から選択');
  sel.innerHTML='<option value="">履歴から選ぶ</option>';
  [...new Set([...(state.histories[history]||[]),...state[key]].filter(Boolean))].forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o)});
  sel.addEventListener('change',()=>{if(sel.value){state[key][i]=sel.value;updateMulti();drawMulti(type)}});row.appendChild(sel);
  const del=document.createElement('button');del.type='button';del.textContent='削除';del.setAttribute('aria-label',(isV?'車両':'班員')+(i+1)+'を削除');del.onclick=()=>{state[key].splice(i,1);if(!state[key].length)state[key].push('');updateMulti();drawMulti(type)};row.appendChild(del);
  box.appendChild(row);
 });
}
$('addVehicle').onclick=()=>{state.vehicleList.push('');saveState();drawMulti('vehicle')};
$('addCrew').onclick=()=>{state.crewList.push('');saveState();drawMulti('crew')};
initMulti();
const oldSync=sync;
sync=function(){oldSync();drawMulti('vehicle');drawMulti('crew')};
const oldRenderAll=renderAll;
renderAll=function(){oldRenderAll();drawMulti('vehicle');drawMulti('crew')};
$('import').addEventListener('change',()=>{setTimeout(()=>{initMulti()},150)},false);
</script></body></html>
